<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>반려동물 모니터링 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</head>
<body class="login-page">
    <button type="button" class="btn btn-theme theme-fab" id="themeToggle" title="테마 전환">🌙</button>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="logo-icon">🐾</span>
                <h1>반려동물 모니터링</h1>
                <p>시스템에 로그인하세요</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginEmail">이메일</label>
                    <input type="email" id="loginEmail" name="email" placeholder="example@email.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <div id="loginResendWrap" class="login-resend-wrap" style="display: none;">
                    <button type="button" class="btn btn-secondary btn-block" id="loginResendBtn">인증 메일 다시 보내기</button>
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>
            <div class="login-footer">
                <p class="login-hint">Supabase에 등록한 이메일로 로그인하세요.</p>
                <p class="signup-link">계정이 없으신가요? <a href="#" id="signupLink">회원가입</a></p>
            </div>
        </div>
    </div>

    <!-- 회원가입 모달 -->
    <div id="signupModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>회원가입</h2>
                <button type="button" class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="signupForm" class="signup-form">
                <div class="form-group">
                    <label for="signupEmail">이메일</label>
                    <input type="email" id="signupEmail" name="email" placeholder="example@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">비밀번호</label>
                    <input type="password" id="signupPassword" name="password" placeholder="비밀번호 (최소 6자)" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="signupPasswordConfirm">비밀번호 확인</label>
                    <input type="password" id="signupPasswordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <div id="signupError" class="error-message" style="display: none;"></div>
                <div id="signupSuccess" class="success-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block">가입하기</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('themeToggle').addEventListener('click', function() {
            const next = theme.toggle();
            this.textContent = next === theme.DARK ? '🌙' : '☀️';
        });
        document.getElementById('themeToggle').textContent = theme.get() === theme.DARK ? '🌙' : '☀️';

        auth.init().then(function() {
            if (auth.isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            errorEl.className = 'error-message';
            errorEl.style.display = 'none';

            if (!auth.isConfigured()) {
                errorEl.textContent = 'Supabase 설정이 필요합니다. js/config.js에 SUPABASE_URL과 SUPABASE_ANON_KEY를 입력하세요.';
                errorEl.style.display = 'block';
                return;
            }

            await auth.init();
            const loginResendWrap = document.getElementById('loginResendWrap');
            loginResendWrap.style.display = 'none';

            const result = await auth.login(email, password);
            if (result.ok) {
                window.location.href = 'dashboard.html';
                return;
            }
            errorEl.textContent = result.message || '로그인에 실패했습니다.';
            errorEl.style.display = 'block';
            if (result.code === 'email_not_confirmed') {
                loginResendWrap.style.display = 'block';
            }
        });

        document.getElementById('loginResendBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const errorEl = document.getElementById('loginError');
            if (!email) {
                errorEl.textContent = '이메일을 입력한 뒤 다시 시도해 주세요.';
                errorEl.style.display = 'block';
                return;
            }
            const r = await auth.resendSignupEmail(email);
            errorEl.className = r.ok ? 'success-message' : 'error-message';
            errorEl.textContent = r.ok ? r.message : r.message;
            errorEl.style.display = 'block';
        });

        const signupModal = document.getElementById('signupModal');
        const signupLink = document.getElementById('signupLink');
        const closeModal = document.getElementById('closeModal');

        signupLink.addEventListener('click', function(e) {
            e.preventDefault();
            signupModal.style.display = 'flex';
            signupModal.classList.add('active');
        });

        function closeSignupModal() {
            signupModal.style.display = 'none';
            signupModal.classList.remove('active');
            document.getElementById('signupForm').reset();
            document.getElementById('signupError').style.display = 'none';
            document.getElementById('signupSuccess').style.display = 'none';
        }

        closeModal.addEventListener('click', closeSignupModal);

        window.addEventListener('click', function(e) {
            if (e.target === signupModal) {
                closeSignupModal();
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const errorEl = document.getElementById('signupError');
            const successEl = document.getElementById('signupSuccess');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!auth.isConfigured()) {
                errorEl.textContent = 'Supabase 설정이 필요합니다. js/config.js를 확인하세요.';
                errorEl.style.display = 'block';
                return;
            }

            if (password !== passwordConfirm) {
                errorEl.textContent = '비밀번호가 일치하지 않습니다.';
                errorEl.style.display = 'block';
                return;
            }

            const result = await auth.signup(email, password);
            if (result.success) {
                if (result.needsConfirmation) {
                    successEl.textContent = '가입 메일을 확인해 주세요. 인증 후 로그인할 수 있습니다.';
                } else {
                    successEl.textContent = '회원가입이 완료되었습니다! 잠시 후 이동합니다.';
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 800);
                }
                successEl.style.display = 'block';
                if (!result.needsConfirmation) return;
                setTimeout(closeSignupModal, 3500);
            } else {
                errorEl.textContent = result.message || '회원가입에 실패했습니다.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
