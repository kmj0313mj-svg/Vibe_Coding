<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반려동물 모니터링 - 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="dashboard">
    <header class="dashboard-header">
        <h1>🐾 반려동물 모니터링</h1>
        <div class="header-actions">
            <button type="button" class="btn btn-theme" id="themeToggle" title="테마 전환">🌙</button>
            <button type="button" class="btn btn-secondary" onclick="location.href='gallery.html'">기록장</button>
            <button type="button" class="btn btn-secondary" onclick="location.href='settings.html'">설정</button>
            <button type="button" class="btn btn-logout" id="logoutBtn">로그아웃</button>
        </div>
    </header>

    <main class="video-section">
        <!-- 캡처 대상: 비디오 + 상태 오버레이 -->
        <div class="video-wrapper" id="captureArea">
        <!-- 실시간 영상 스트리밍 영역 -->
        <div class="video-container" id="videoContainer">
            <video id="streamVideo" autoplay muted playsinline style="display: none;"></video>
            <div class="video-placeholder" id="videoPlaceholder">
                <span class="placeholder-icon">📹</span>
                <span>실시간 영상 스트리밍 영역</span>
                <span style="font-size: 0.85rem; margin-top: 8px;">(실제 구현 시 카메라/스트리밍 서버 연결 필요)</span>
            </div>
        </div>

        <!-- 반려동물 상태 표시 오버레이 -->
        <div class="status-overlay" id="statusOverlay">
            <div class="status-badge" id="statusBadge">
                <span id="statusIcon">🟢</span>
                <span id="statusText">반려동물 있음</span>
            </div>
            <div class="status-time" id="statusTime">⏱ 마지막 감지 시간: 14:32</div>
        </div>
        </div>

        <!-- 화면 캡처 버튼 -->
        <div class="video-controls">
            <button type="button" class="btn btn-primary" id="captureBtn">📷 현재 화면 캡처</button>
        </div>

        <!-- 음성 송출 영역 -->
        <section class="voice-section">
            <h3>🔊 음성 송출</h3>
            <div class="voice-input-group">
                <input type="text" id="voiceInput" placeholder="말할 내용을 입력하세요..." maxlength="200">
                <button type="button" class="btn btn-primary" id="voiceSendBtn">음성 보내기</button>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 12px;">
                ※ 현재는 브라우저에서 텍스트를 음성으로 재생합니다. 실제 홈 기기로 전달하려면 서버 연동이 필요합니다.
            </p>
        </section>

        <!-- 기록장 미리보기 섹션 -->
        <section class="dashboard-gallery-section">
            <div class="section-header">
                <h3>📷 최근 사진첩</h3>
                <a href="gallery.html" class="view-all-link">전체보기 →</a>
            </div>
            <div class="recent-photos" id="recentPhotos">
                <div class="empty-state-mini">
                    <span class="empty-icon-mini">🖼️</span>
                    <p>저장된 사진이 없습니다</p>
                </div>
            </div>
        </section>

        <!-- 일기 미리보기 섹션 -->
        <section class="dashboard-diary-section">
            <div class="section-header">
                <h3>📝 최근 일기</h3>
                <a href="gallery.html" class="view-all-link">전체보기 →</a>
            </div>
            <div class="recent-diaries" id="recentDiaries">
                <div class="empty-state-mini">
                    <span class="empty-icon-mini">📝</span>
                    <p>작성된 일기가 없습니다</p>
                </div>
            </div>
        </section>

        <!-- AI 챗봇 영역 -->
        <section class="chatbot-section">
            <div class="chatbot-header">
                <h3>🤖 AI 반려동물 상담 챗봇</h3>
                <button type="button" class="btn-icon" id="chatbotToggle" title="챗봇 열기/닫기">💬</button>
            </div>
            <div class="chatbot-container" id="chatbotContainer">
                <div class="chatbot-messages" id="chatbotMessages">
                    <div class="chatbot-message bot-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <p>안녕하세요! 반려동물 관련 질문이 있으시면 무엇이든 물어보세요. 😊</p>
                        </div>
                    </div>
                </div>
                <div class="chatbot-input-area">
                    <input type="text" id="chatbotInput" placeholder="메시지를 입력하세요..." maxlength="500">
                    <button type="button" class="btn btn-primary" id="chatbotSendBtn">전송</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
